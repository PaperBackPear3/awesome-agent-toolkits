[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-toolkit-mcp-server"
version = "0.4.0"
description = "MCP server providing persistent notes, todos, timers, and a cross-project registry — capabilities that augment Claude Code's built-in harness."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "PaperBackPear3" },
]
dependencies = [
    "mcp>=1.0.0",
]

[project.urls]
Repository = "https://github.com/PaperBackPear3/awesome-agent-toolkits"

[project.scripts]
agent-toolkit-mcp-server = "server:main"

[tool.hatch.build.targets.wheel]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"storage.py" = "storage.py"
"db.py" = "db.py"
"notes.py" = "notes.py"
"todos.py" = "todos.py"
"timers.py" = "timers.py"
"projects.py" = "projects.py"
