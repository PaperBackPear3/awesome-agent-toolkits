[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "post-work-checks-mcp"
version = "1.0.0"
description = "MCP server providing per-project post-work todo lists for AI agents."
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Fabio Angeloni" },
]
dependencies = [
    "mcp>=1.0.0",
]

[project.urls]
Repository = "https://github.com/PaperBackPear3/awesome-agent-toolkits/plugins/post-work-checks"

[project.scripts]
post-work-checks-mcp = "server:main"

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
